# Netlify: builds the widget app (chat page, admin page, demo page, widget.js)
[build]
  base = "widget"
  command = "npm run build"
  publish = "dist"

# Not a secret: the public backend URL, baked into the build by Vite
[build.environment]
  VITE_API_URL = "https://faq-chat-api.onrender.com"

[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Robots-Tag = "noindex"
