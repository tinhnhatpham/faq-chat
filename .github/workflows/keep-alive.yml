# Supabase pauses free projects after 7 days without activity, which would break the live demos.
# This makes one small database request to each project every 3 days so they stay active.
# (The paywall key below is its public "publishable" key, already in that repo's netlify.toml;
# its database rules return nothing to it, but the request still counts as activity.)
name: Keep demo databases active

on:
  schedule:
    - cron: "0 14 */3 * *"  # 14:00 UTC every 3 days
  workflow_dispatch:         # "Run workflow" button for a manual test

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: FAQ Chat database (through its API)
        run: curl --fail --silent --show-error --max-time 120 https://faq-chat-api.onrender.com/api/business/riverside-dental

      - name: Paywall demo database (Supabase REST, public key)
        run: >
          curl --fail --silent --show-error --max-time 60
          "https://iksirkdxcuwppuxaosmn.supabase.co/rest/v1/premium_content?select=id&limit=1"
          -H "apikey: sb_publishable_mq_DMSGJuaVDrrb7E4CK_A_mRUdq9N2"
